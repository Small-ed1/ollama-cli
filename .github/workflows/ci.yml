name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]
      - name: Lint (syntax)
        run: python -m compileall src/ollama_cli
      - name: Type check
        run: python -m mypy src/ollama_cli
      - name: Tests
        run: python -m pytest tests/
      - name: Build wheel
        run: python -m build
